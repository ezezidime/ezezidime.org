<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-100 -100 200 200" role="img" aria-label="Sonne mit 21 Strahlen">
  <style>
    .strahlen{transform-origin:0px 0px;animation:dreh 40s linear infinite}
    @keyframes dreh{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){.strahlen{animation:none}}
  </style>
  <defs>
    <polygon id="strahl" points="-5.5,-46 0,-95 5.5,-46" fill="#C8962E"/>
  </defs>
  <!-- 21 Strahlen, je 360/21 = 17,142857 Grad -->
  <g class="strahlen">
    <use href="#strahl" xlink:href="#strahl" transform="rotate(0)"/>
    <use href="#strahl" xlink:href="#strahl" transform="rotate(17.142857)"/>
    <use href="#strahl" xlink:href="#strahl" transform="rotate(34.285714)"/>
    <use href="#strahl" xlink:href="#strahl" transform="rotate(51.428571)"/>
    <use href="#strahl" xlink:href="#strahl" transform="rotate(68.571429)"/>
    <use href="#strahl" xlink:href="#strahl" transform="rotate(85.714286)"/>
    <use href="#strahl" xlink:href="#strahl" transform="rotate(102.857143)"/>
    <use href="#strahl" xlink:href="#strahl" transform="rotate(120)"/>
    <use href="#strahl" xlink:href="#strahl" transform="rotate(137.142857)"/>
    <use href="#strahl" xlink:href="#strahl" transform="rotate(154.285714)"/>
    <use href="#strahl" xlink:href="#strahl" transform="rotate(171.428571)"/>
    <use href="#strahl" xlink:href="#strahl" transform="rotate(188.571429)"/>
    <use href="#strahl" xlink:href="#strahl" transform="rotate(205.714286)"/>
    <use href="#strahl" xlink:href="#strahl" transform="rotate(222.857143)"/>
    <use href="#strahl" xlink:href="#strahl" transform="rotate(240)"/>
    <use href="#strahl" xlink:href="#strahl" transform="rotate(257.142857)"/>
    <use href="#strahl" xlink:href="#strahl" transform="rotate(274.285714)"/>
    <use href="#strahl" xlink:href="#strahl" transform="rotate(291.428571)"/>
    <use href="#strahl" xlink:href="#strahl" transform="rotate(308.571429)"/>
    <use href="#strahl" xlink:href="#strahl" transform="rotate(325.714286)"/>
    <use href="#strahl" xlink:href="#strahl" transform="rotate(342.857143)"/>
  </g>
  <circle r="40" fill="#C8962E"/>
  <circle r="31" fill="none" stroke="#A8322D" stroke-width="4"/>
  <circle r="22" fill="#E2B85A"/>
</svg>
